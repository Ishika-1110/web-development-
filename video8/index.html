<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and block elemens</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>This is a paragraph. It is a block-level element.</p>
    <span>This is a span. It is an inline element.</span>
    &nbsp; <!-- This is a non-breaking space -->
    <a href="google.com">This is a link. It is an inline element.</a>
    <div>This is a div. It is a block-level element.</div>
    <form>
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
        </div>
        <div>
            <label for="city">City:</label>
            <input type="text" id="city" name="city">
        </div>
        <div>
            <label for="pincode">Pincode:</label>
            <input type="text" id="pincode" name="pincode">
        </div>
    </form>
</body>
</html>
